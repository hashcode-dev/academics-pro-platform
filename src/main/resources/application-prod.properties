# Production Profile Configuration for Academics Pro Platform
server.port=${PORT:8080}
spring.application.name=academics-pro-platform

# Multi-Tenancy & Platform Settings
app.platform.name=Academics Pro SaaS
app.platform.version=1.0.0
app.jwt.secret=${JWT_SECRET:academics-pro-super-secure-jwt-secret-key-for-saas-platform-2026-production-grade}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# MongoDB Configuration for Content CMS
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/academics_content_prod}

# Production Logging
logging.level.root=INFO
logging.level.com.academicspro=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n
