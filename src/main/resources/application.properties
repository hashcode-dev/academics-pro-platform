server.port=8080
spring.application.name=academics-pro-platform

# Multi-Tenancy & Platform Settings
app.platform.name=Academics Pro SaaS
app.platform.version=1.0.0
app.jwt.secret=academics-pro-super-secure-jwt-secret-key-for-saas-platform-2026-production-grade
app.jwt.expiration-ms=86400000

# MongoDB Configuration for Content CMS
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/academics_content_dev}
spring.data.mongodb.database=${MONGODB_DATABASE:academics_content_dev}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.hashcode.invoicely=DEBUG
logging.level.com.academicspro=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n
